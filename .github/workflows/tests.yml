name: tests

# Suite de tests de tools/_continuum/ (vía template/tools/). Vive solo en
# este meta-repositorio: `tests/` no se distribuye a los proyectos que
# incorporan Continuum, así que este workflow no está en template/.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -t . -v
