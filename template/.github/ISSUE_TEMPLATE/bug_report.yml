name: 🐛 Reporte de bug
description: Algo en el CLI, los hooks o la generación de roles/skills no funciona como debería.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un problema. Antes de continuar, revisa que no exista ya un issue similar.

  - type: textarea
    id: description
    attributes:
      label: Descripción del bug
      description: ¿Qué esperabas que pasara y qué pasó en realidad?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Comandos ejecutados, contenido relevante de `.ai/config.json`, etc.
      placeholder: |
        1. Ejecuté `tools/continuum roles sync --provider ...`
        2. ...
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Proveedor de IA afectado
      multiple: true
      options:
        - claude
        - codex
        - gemini
        - copilot
        - No aplica / es independiente del proveedor
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión de Continuum
      description: Contenido de `CHANGELOG.md` (top) o commit/tag usado.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Entorno
      placeholder: |
        - OS:
        - Versión de Python:
        - Rama (main/develop/export):
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Salida relevante / logs
      description: Salida de `tools/continuum doctor` u otro comando, sin datos sensibles.
      render: shell
    validations:
      required: false
