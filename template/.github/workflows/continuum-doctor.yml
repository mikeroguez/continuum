name: continuum-doctor

# Corre `continuum doctor` en cada PR como reporte visible, sin bloquear el
# merge por defecto (continue-on-error: true). Para hacerlo obligatorio,
# basta con quitar esa línea.
on:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: continuum doctor
        continue-on-error: true
        run: python3 tools/continuum doctor
